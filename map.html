<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Resource Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .btm {
      display: block;
      text-align: center;
      margin: 10px auto;
      width: 120px;
      padding: 10px 0;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .btm:hover {
      background-color: #45a049;
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h1>Community Resource Map</h1>
<a href="index.html" class="btm">Back</a>

<div id="map"></div>

<script>
  var map = L.map('map').setView([34.075, -84.294], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var locations = [
    ["Food Bank", 34.0736, -84.2941],
    ["Community Shelter", 34.0612, -84.2805],
    ["Library", 34.0501, -84.3002]
  ];

  locations.forEach(function(loc){
    L.marker([loc[1], loc[2]])
      .addTo(map)
      .bindPopup("<b>" + loc[0] + "</b>");
  });
</script>

</body>
</html>
