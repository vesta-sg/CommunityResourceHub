<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Resource Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .btm {
      display: block;
      text-align: center;
      margin: 10px auto;
      width: 120px;
      padding: 10px 0;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .btm:hover {
      background-color: #45a049;
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h1>Community Resource Map</h1>
<a href="index.html" class="btm">Back</a>

<div id="map"></div>

<script>
  var map = L.map('map').setView([34.075, -84.294], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var locations = [
var locations = [

  ["Post Consumer Brands Food Access", 34.0489, -84.1746],
  ["Stella Love Nonprofit", 33.9295, -84.3796],

  ["Americas Youth In Motion", 34.0733, -84.2941],
  ["North Fulton Young Life", 34.0754, -84.2941],

  ["Best Brains Alpharetta", 34.0703, -84.2747],
  ["East Cobb Tutoring Center", 34.0406, -84.4700],

  ["Merely Players Theater", 34.0739, -84.2941],
  ["Act1 Theater", 34.0804, -84.3617],

  ["Childrens Healthcare Volunteer", 33.7936, -84.3224],
  ["Open Hand Atlanta", 33.8090, -84.3900],

  ["Goodman Dermatology", 34.0750, -84.2940],
  ["Southeast Medical Group", 34.0665, -84.2877]

];


  locations.forEach(function(loc){
    L.marker([loc[1], loc[2]])
      .addTo(map)
      .bindPopup("<b>" + loc[0] + "</b>");
  });
</script>

</body>
</html>
