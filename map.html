<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Resource Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f6f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .btm {
      display: block;
      text-align: center;
      margin: 10px auto;
      width: 120px;
      padding: 10px 0;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .btm:hover {
      background-color: #45a049;
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h1>Community Resource Map</h1>
<a href="index.html" class="btm">Back</a>

<div id="map"></div>

<script>
  var map = L.map('map').setView([34.075, -84.294], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var locations = [

    ["Post Consumer Brands Food Access", 34.0489, -84.1746, "https://www.postconsumerbrands.com/responsibility/community-impact/food-accessibility/"],
    ["Stella Love Nonprofit", 33.9295, -84.3796, "https://iamstellalove.com/"],

    ["Americas Youth In Motion", 34.0733, -84.2941, "https://americasyouthinmotion.org/"],
    ["North Fulton Young Life", 34.0754, -84.2941, "https://northfulton.younglife.org/"],

    ["Best Brains Alpharetta", 34.0703, -84.2747, "https://bestbrains.com/alpharetta"],
    ["East Cobb Tutoring Center", 34.0406, -84.4700, "https://eastcobbtutoringcenter.com/"],

    ["Merely Players Theater", 34.0739, -84.2941, "https://www.merelyplayerspresents.com/"],
    ["Act1 Theater", 34.0804, -84.3617, "https://act1theater.org/contact-us"],

    ["Childrens Healthcare Volunteer", 33.7936, -84.3224, "https://www.childrn.org/volunteer/"],
    ["Open Hand Atlanta", 33.8090, -84.3900, "https://www.openhandatlanta.org/"],

    ["Goodman Dermatology", 34.0750, -84.2940, "https://www.goodmandermatology.com/"],
    ["Southeast Medical Group", 34.0665, -84.2877, "https://mysemg.com/"]
  ];

  locations.forEach(function(loc){
    L.marker([loc[1], loc[2]])
      .addTo(map)
      .bindPopup(
        "<b>" + loc[0] + "</b><br><br>" +
        "<a href='" + loc[3] + "' target='_blank'>Visit Website</a>"
      );
  });
</script>

</body>
</html>
