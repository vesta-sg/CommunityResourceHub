<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Resource Map</title>

  <!-- Leaflet library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Your CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>Community Resource Map</h1>
<a href="index.html">Back</a>

<div id="map"></div>

<script>
  var map = L.map('map').setView([34.075, -84.294], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var locations = [
    ["Food Bank", 34.0736, -84.2941],
    ["Community Shelter", 34.0612, -84.2805],
    ["Library", 34.0501, -84.3002]
  ];

  locations.forEach(function(loc){
    L.marker([loc[1], loc[2]])
      .addTo(map)
      .bindPopup("<b>" + loc[0] + "</b>");
  });
</script>


</body>
</html>
