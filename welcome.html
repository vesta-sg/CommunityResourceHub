<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
    background-color: #000;
    color: #fff;
  }

  /* Top Navigation */
  nav.topnav {
    background-color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 20px; /* same as other pages */
  }

  .logo {
    display: flex;
    align-items: center;
  }

  .logo-img {
    height: 30px; /* same size as other pages */
    width: auto;
    margin-right: 10px;
  }

  .nav-links {
    margin-left: auto;
  }

  .nav-links a {
    color: #000;
    text-decoration: none;
    margin-left: 25px;
    font-weight: bold;
    font-size: 16px;
  }

  .nav-links a:hover {
    text-decoration: underline;
  }

  /* Hero Section */
  .welcome-hero {
    padding: 60px 20px 40px 20px;
    background: #3498db;
    color: #fff;
  }

  .welcome-hero h1 {
    font-size: 36px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeIn 1s forwards;
    animation-delay: 0.3s;
  }

  .welcome-hero p {
    font-size: 18px;
    max-width: 800px;
    margin: 0 auto;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 1s forwards;
    animation-delay: 0.8s;
  }

  /* Overview Section */
  .welcome-overview {
    padding: 60px 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .welcome-overview h2,
  .welcome-overview h3,
  .welcome-overview p {
    opacity: 0;
    animation: fadeIn 1s forwards;
  }

  /* Fade-in delays */
  .welcome-overview h2 { animation-delay: 1.3s; }
  .welcome-overview h3:nth-of-type(1) { animation-delay: 1.6s; }
  .welcome-overview p:nth-of-type(1) { animation-delay: 1.9s; }
  .welcome-overview h3:nth-of-type(2) { animation-delay: 2.2s; }
  .welcome-overview p:nth-of-type(2) { animation-delay: 2.5s; }
  .welcome-overview h3:nth-of-type(3) { animation-delay: 2.8s; }
  .welcome-overview p:nth-of-type(3) { animation-delay: 3.1s; }
  .welcome-overview h3:nth-of-type(4) { animation-delay: 3.4s; }
  .welcome-overview p:nth-of-type(4) { animation-delay: 3.7s; }
  .welcome-overview h3:nth-of-type(5) { animation-delay: 4.0s; }
  .welcome-overview p:nth-of-type(5) { animation-delay: 4.3s; }
  .welcome-overview h3:nth-of-type(6) { animation-delay: 4.6s; }
  .welcome-overview p:nth-of-type(6) { animation-delay: 4.9s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Button under last paragraph */
  .btm {
    display: inline-block;
    padding: 12px 25px;
    margin-top: 20px;
    background: #3498db;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: background 0.3s;
  }

  .btm:hover {
    background: #2980b9;
  }

</style>
</head>
