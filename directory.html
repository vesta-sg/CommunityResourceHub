<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Community Resource Directory</title>
  <meta name="description" content="Chattahoochee Community Resource Hub Directory">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .topnav {
      background-color: #111;
      padding: 15px;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .nav-links a:hover {
      color: cyan;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 30px;
      color: cyan;
    }

    .mini-resources {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto 50px auto;
    }

    .mini-card {
      background-color: rgba(0,0,0,0.9);
      border: 2px solid rgba(0, 123, 255, 0.7);
      border-radius: 10px;
      width: 250px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }

    .mini-card:hover {
      transform: scale(1.05);
      border-color: rgba(0, 123, 255, 1);
    }

    .mini-card h3 {
      margin-top: 0;
      color: white;
    }

    .mini-card p {
      color: white;
      font-size: 14px;
    }

    .btm {
      display: block;
      text-align: center;
      margin: 20px auto;
      width: 150px;
      padding: 10px 0;
      background-color: #ff6600;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .btm:hover {
      background-color: #e65c00;
    }
  </style>
</head>
<body>

<nav class="topnav">
  <div class="nav-container">
    <div class="logo">Community Hub</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="map.html">Map</a>
      <a href="submit.html">Submit Resource</a>
    </div>
  </div>
</nav>


<h1>Community Resource Directory</h1>

<div class="mini-resources" id="miniResourcesContainer">
  <!-- Resources will appear here -->
</div>

<a href="index.html" class="btm">Back to Home</a>

<script>
  // Grab container
  const directoryContainer = document.getElementById("miniResourcesContainer");

  // Function to display resources from sessionStorage
  function displayResources() {
    const storedResources = JSON.parse(sessionStorage.getItem("communityResources")) || [];
    directoryContainer.innerHTML = ""; // clear first

    storedResources.forEach(res => {
      const box = document.createElement("div");
      box.classList.add("mini-card");
      box.innerHTML = `
        <h3>${res.name}</h3>
        <p><strong>Category:</strong> ${res.category}</p>
        <p>${res.description}</p>
      `;
      directoryContainer.appendChild(box);
    });
  }

  // Display resources on page load
  displayResources();
</script>

</body>
</html>
