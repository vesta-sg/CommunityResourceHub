<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Submit a New Community Resource</title>
<meta name="description" content="Submit a new resource to the Chattahoochee Community Hub">
<style>
  body {
    background-color: black;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  /* Top Navigation (same as other pages) */
  .topnav {
    background-color: #111;
    display: flex;
    align-items: center;
    padding: 15px 20px;
  }

  .logo-link {
    display: flex;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
    text-decoration: none;
  }

  .logo-img {
    height: 40px;
    width: auto;
    margin-right: 15px;
  }

  .nav-links {
    margin-left: auto;
  }

  .nav-links a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-weight: bold;
    font-size: 16px;
  }

  .nav-links a:hover {
    color: cyan;
  }

  /* Form section */
  section {
    max-width: 700px;
    margin: 50px auto;
    padding: 30px;
    background-color: #111;
    border-radius: 10px;
    text-align: center;
  }

  h1 {
    color: #1A3F7A; /* darker blue */
    font-size: 42px;
    margin-bottom: 25px;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 5px;
    border: none;
    font-size: 16px;
    box-sizing: border-box;
  }

  button {
    display: block;
    width: 100%;
    padding: 12px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #45a049;
  }

  .btm {
    display: inline-block;
    margin-top: 20px;
    text-align: center;
    color: white;
    text-decoration: none;
    background-color: #4CAF50;
    padding: 12px 25px;
    border-radius: 5px;
    font-weight: bold;
  }

  .btm:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="topnav">
  <a href="index.html" class="logo-link">
    <img src="https://i.postimg.cc/0yCzGm7K/Screenshot-2026-02-13-190748.png" alt="Community Hub Logo" class="logo-img">
    Community Hub
  </a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="map.html">Map</a>
    <a href="directory.html">Directory</a>
  </div>
</nav>

<!-- Form Section (centered) -->
<section>
  <h1>Submit a New Community Resource</h1>
  <form id="resourceForm">
    <input type="text" id="name" placeholder="Resource Name" required>

    <select id="category" required>
      <option value="">Select Category</option>
      <option value="Food">Food Assistance</option>
      <option value="Education">Education</option>
      <option value="Healthcare">Healthcare</option>
      <option value="Events">Community Events</option>
    </select>

    <textarea id="description" placeholder="Description" required></textarea>

    <button type="submit">Submit Resource</button>
  </form>

  <a href="index.html" class="btm">Back to Home</a>
</section>

<script>
const resourceForm = document.getElementById("resourceForm");

resourceForm.addEventListener("submit", e => {
  e.preventDefault();
  
  const stored = JSON.parse(sessionStorage.getItem("communityResources")) || [];
  
  const newResource = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value
  };
  
  stored.push(newResource);
  sessionStorage.setItem("communityResources", JSON.stringify(stored));
  
  alert("Thank you for submitting a resource!");
  resourceForm.reset();
});
</script>

</body>
</html>
